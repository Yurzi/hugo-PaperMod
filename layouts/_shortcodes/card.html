{{- if .IsNamedParams }}
<div class="card">
  {{- with .Get "icon" }}<img class="card-icon" alt="" src="{{ . | safeURL }}" />{{ end }}
  <div class="card-text-wrapper">
    {{- with .Get "title" }}<h2 class="card-title">{{ . }}</h2>{{ end }}
    {{- with .Inner }}
    <div class="card-text-content">
      {{ . | markdownify | safeHTML }}
    </div>
    {{- end }}
  </div>
</div>
{{- end }}
