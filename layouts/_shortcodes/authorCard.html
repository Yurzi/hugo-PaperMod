{{- if .IsNamedParams }}
<div class="author-card">
  {{- $name := .Get "name" }}
  {{- with .Get "avatar" }}<img class="author-avatar" alt="{{ with $name }}{{ . }} avatar{{ else }}author avatar{{ end }}" src="{{ . | safeURL }}" />{{ end }}
  <div class="author-card-text-wrapper">
    {{- with $name }}<h2 class="author-name">{{ . }}</h2>{{ end }}
    {{- with .Inner }}
    <div class="author-card-text-content">
      {{ . | markdownify | safeHTML }}
    </div>
    {{- end }}
  </div>
</div>
{{- end }}
