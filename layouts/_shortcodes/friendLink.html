{{- if .IsNamedParams -}}
{{- $title := .Get "title" -}}
<div class="friend-wrapper">
  {{- with .Get "logo" }}
  <img class="friend-logo" src="{{ . | safeURL }}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />
  {{- else }}
  <span class="friend-logo friend-logo-empty" aria-hidden="true"></span>
  {{- end }}
  <div class="friend-text-wrapper">
    <div class="friend-text-title">{{ $title }}</div>
    {{- with .Get "word" }}
    <div class="friend-text-word">{{ . }}</div>
    {{- end }}
  </div>
  {{- with .Get "url" }}
  <a class="entry-link" aria-label="{{ $title }}" href="{{ . | safeURL }}"></a>
  {{- end }}
</div>
{{- end }}
